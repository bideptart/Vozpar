<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vzTile" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2a2e" />
      <stop offset="100%" stop-color="#151517" />
    </linearGradient>
    <linearGradient id="vzGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="vzRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#c81e1e" />
    </linearGradient>
    <linearGradient id="vzAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="vzLeftArm" x1="248" y1="126" x2="310" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="28%" stop-color="#ef4444" />
      <stop offset="58%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="vzRightArm" x1="310" y1="386" x2="418" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Ascending bars. Widened to 52px with 16px gaps: at a 16px favicon each
       bar lands on roughly a whole pixel, so they stay three distinct marks
       instead of blurring into one block. Brighter top stops for the same
       reason — thin dark shapes vanish first when downscaled. -->
  <rect x="56" y="292" width="52" height="100" rx="10" fill="url(#vzGreen)" />
  <rect x="124" y="240" width="52" height="152" rx="10" fill="url(#vzRed)" />
  <rect x="192" y="176" width="52" height="216" rx="10" fill="url(#vzAmber)" />

  <!-- V-arrow, shifted right so it clears the bars instead of overlapping
       them (the overlap was hiding the bars at small sizes). -->
  <path d="M262 132 L312 382" stroke="url(#vzLeftArm)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M312 382 L404 176" stroke="url(#vzRightArm)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="466,96 372,124 434,184" fill="#38bdf8" />
</svg>
